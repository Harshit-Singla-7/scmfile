<html>
<head>
    <title> FLEX LAYOUT</title>
    <style>
    .flex-container{
        width: 600px;
        height:600px;
        border: 5px solid black;
        display:flex;
        flex-wrap:wrap;
        flex-direction:row;
        justify-content:space-evenly;
        align-items:center;
        align-content:space-evenly;


        }
    .flex-container div{
        width:40px;
        height:40px; 
        border-radius:10px;
        border:3px solid black
    }
    </style>
</head>
<body>
    <div class="flex-container">
        <div style="background-color:red">A</div>
        <div style="background-color:blue">B</div>
        <div style="background-color:green">C</div>
        <div style="background-color:yellow">D</div>
        <div style="background-color:rgb(71, 14, 14)">E</div>
        <div style="background-color:orange">F</div>
        <div style="background-color:indigo">G</div>
    </div>
</body>
</html>
